{{ block title }}
Belief and evaluation
{{ endblock }}

{{ block content }}

<link rel="stylesheet" href="{{ static 'investment_game/style.css' }}">

<form method="post">

<p>You observed the public signal:</p>
<h3>{{ player.public_signal }}</h3>

<hr>

<label>
What is your estimate that the project is in the good state?
</label>

<input type="range" name="belief_good" min="0" max="100" value="50"
       oninput="belief_value.innerText = this.value; belief_touched.value = 1">

<input type="hidden" name="belief_touched" id="belief_touched" value="0">

<p><strong><span id="belief_value">Move the slider</span>%</strong></p>

<hr>

<label>
How useful do you think additional information would be for your investment decision?
</label>

<input type="range" name="confidence_tau" min="0" max="100" value="50"
       oninput="confidence_value.innerText = this.value; confidence_touched.value = 1">

<input type="hidden" name="confidence_touched" id="confidence_touched" value="0">

<p>
0 = Not useful at all, 100 = Very useful
</p>
<p><strong><span id="confidence_value">Move the slider</span></strong></p>

<hr>

<label>
When deciding whether to buy additional information, how likely are you to rely on this assessment?
</label>

<input type="range" name="kappa" min="0" max="100" value="50"
       oninput="kappa_value.innerText = this.value; kappa_touched.value = 1">

<input type="hidden" name="kappa_touched" id="kappa_touched" value="0">

<p>
0 = Not at all, 100 = Completely
</p>
<p><strong><span id="kappa_value">Move the slider</span></strong></p>

<hr>

<button class="otree-btn-next btn btn-primary">Next</button>

</form>

{{ endblock }}
